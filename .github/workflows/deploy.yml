# Publicación automática: cada cambio fusionado en master se publica solo
# en Firebase Hosting (app + web pública). Necesita el secreto
# FIREBASE_SERVICE_ACCOUNT_DONPEPITO_2607151158, que se crea una única vez
# ejecutando «firebase init hosting:github» desde el ordenador con sesión
# de Firebase iniciada.
name: Publicar en Firebase Hosting
on:
  push:
    branches: [master]
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - id: llave
        run: echo "hay=${{ secrets.FIREBASE_SERVICE_ACCOUNT_DONPEPITO_2607151158 != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.llave.outputs.hay == 'true'
        uses: actions/checkout@v4
      - if: steps.llave.outputs.hay == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DONPEPITO_2607151158 }}
          channelId: live
          projectId: donpepito-2607151158
